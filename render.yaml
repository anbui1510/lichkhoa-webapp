# Blueprint Render — API auth (F-101) + Postgres (Supabase)
# F-304 Sheet (lịch trên Google Sheet): docs/DEPLOY-SHEET-PLUS-AUTH.md
# F-303 sync lịch Postgres: docs/DEPLOY-SUPABASE.md
services:
  - type: web
    name: lichkhoa-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_VERSION
        value: "22"
